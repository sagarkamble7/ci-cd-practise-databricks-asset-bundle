# This is a Declarative Automation Bundle definition for bundle_ci_cd_practise_databricks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bundle_ci_cd_practise_databricks
  uuid: e1d76ec8-0be7-4d58-9c81-062409f0711b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-112b92a0-a483.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-112b92a0-a483.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/sagarnkamble7@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sagarnkamble7@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prod
      schema: rnd
    permissions:
      - user_name: sagarnkamble7@gmail.com
        level: CAN_MANAGE
